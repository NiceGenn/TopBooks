name: Check and publish to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify Excel import is reproducible
        run: |
          python3 scripts/import_books.py
          git diff --exit-code -- src/data/books.json
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Report Pages source mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if mode=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/tmp/pages-mode-error); then
            echo "::notice title=Pages source mode::$mode"
            if [ "$mode" != "workflow" ]; then
              echo "::warning title=Pages source configuration::Pages uses $mode. Select GitHub Actions in repository Settings / Pages to prevent branch builds overwriting dist."
            fi
          else
            echo "::warning title=Pages source lookup::$(cat /tmp/pages-mode-error)"
          fi
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4


  verify-site:
    name: Verify published application
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check public HTML, assets and browser rendering
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/check-published-site.mjs "$SITE_URL"
      - name: Save published site diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-site-diagnostics
          path: test-results/published-site.*
